<div class="admin-wrapper">
  <div class="admin-card">

    <div class="admin-header">
      <h2 class="admin-title">Admins</h2>
      <button type="button" class="btn btn--primary" (click)="openForm()">+ Add Admin</button>
    </div>

  <div class="table-scroll" *ngIf="admins.length; else emptyState">
  <table class="admin-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Created</th>
        <th class="col-action">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let admin of admins; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ admin.name }}</td>
        <td>{{ admin.createdAt | date: 'dd MMM yyyy, hh:mm a' }}</td>
        <td class="col-action">
          <button type="button" class="btn-delete" (click)="remove(admin)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #emptyState>
  <div class="empty-state">No admins yet. Click "Add Admin" to create one.</div>
</ng-template>

  </div>
</div>

<!-- Add Admin popup -->
<div class="modal-overlay" *ngIf="showForm" (click)="closeForm()">
  <form
    class="modal-card"
    [formGroup]="adminForm"
    (ngSubmit)="onSubmit()"
    (click)="$event.stopPropagation()">

    <h3 class="modal-title">Add Admin</h3>

    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Enter name" maxlength="30" />
      <span class="error-text" *ngIf="isInvalid('name')">Name is required</span>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-row">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter password" />
        <button type="button" class="toggle-btn" (click)="showPassword = !showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
      <span class="error-text" *ngIf="isInvalid('password')">
        Password must be at least 6 characters
      </span>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input
        [type]="showPassword ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Re-enter password" />
      <span class="error-text" *ngIf="isInvalid('confirmPassword')">
        Please confirm the password
      </span>
      <span
        class="error-text"
        *ngIf="adminForm.hasError('mismatch') && adminForm.get('confirmPassword')?.touched">
        Passwords do not match
      </span>
    </div>

    <span class="error-text" *ngIf="error">{{ error }}</span>

    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" (click)="closeForm()">Cancel</button>
      <button type="submit" class="btn btn--primary">Add Admin</button>
    </div>
  </form>
</div>

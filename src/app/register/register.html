<div class="login-page">
  <aside class="login-brand" [style.background-image]="'url(' + heroImage() + ')'">
    <div class="login-brand__overlay"></div>

    <div class="login-brand__inner">
      <span class="login-brand__mark">Macarena</span>

      <p class="login-brand__quote">
        Join the room<br />
        before it's on the rail.
      </p>

      <span class="login-brand__caption">Members see new arrivals first</span>
    </div>
  </aside>

  <main class="login-form-panel">
    <div class="login-form-panel__inner">
      <header class="login-header">
        <h1>Create an account</h1>
        <p class="login-subtext">
          Already a member?
          <a href="/">Sign in</a>
        </p>
      </header>

      <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input
            id="fullName"
            type="text"
            name="fullName"
            autocomplete="name"
            [ngModel]="fullName()"
            (ngModelChange)="fullName.set($event)"
            required
          />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field__password-wrap">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              autocomplete="new-password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              required
            />
            <button
              type="button"
              class="field__toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              <ng-container *ngIf="!showPassword(); else hideIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
                </svg>
              </ng-container>
              <ng-template #hideIcon>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C3.9 8.4 2 12 2 12s4 7 11 7c2 0 3.7-.5 5.1-1.3M17.5 17.4C20 15.7 22 12 22 12s-1.6-2.8-4.4-4.8"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </ng-template>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            autocomplete="new-password"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            required
          />
        </div>

        <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

        <button type="submit" class="submit-btn" [disabled]="loading()">
          {{ loading() ? 'Creating account…' : 'Create account' }}
        </button>
      </form>
    </div>
  </main>
</div>

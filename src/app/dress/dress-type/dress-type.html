<div class="dt-page">
  <header class="dt-header">
    <svg viewBox="0 0 24 24" class="dt-header__icon" aria-hidden="true">
      <path d="M6 3l6 6-9 9v-6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M12 3h6l3 3v6l-9 9-9-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="15.5" cy="7.5" r="1" fill="currentColor" stroke="none"/>
    </svg>
    <div>
      <h1 class="dt-header__title">Dress Types</h1>
      <p class="dt-header__subtitle">Categories available when adding a new product.</p>
    </div>
  </header>

  <main class="dt-main">
    <section class="dt-add">
      <input
        type="text"
        [formControl]="nameControl"
        placeholder="Ladies Dress, T-Shirt, Shorts…"
        maxlength="30"
        (keydown.enter)="add()" />

      <button type="button" class="btn btn--primary" (click)="add()">
        <svg viewBox="0 0 12 12" class="icon-plus" aria-hidden="true">
          <path d="M6 1v10M1 6h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>{{ editingId !== null ? 'Update type' : 'Add type' }}</span>
      </button>

      <button
        type="button"
        class="btn btn--ghost"
        *ngIf="editingId !== null"
        (click)="cancelEdit()">
        Cancel
      </button>
    </section>

    <section class="dt-list">
      <div class="dt-list__grid" *ngIf="(dressTypes$ | async) as types">
        <ng-container *ngIf="types.length; else emptyState">

          <div
            class="type-card"
            *ngFor="let type of types"
            [class.type-card--editing]="editingId === type.id"
            (click)="edit(type)">

            <svg viewBox="0 0 16 16" class="icon-tag" aria-hidden="true">
              <path d="M2 2l5-0.5L14 9l-5 5L2 7z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              <circle cx="5" cy="5" r="0.9" fill="currentColor" stroke="none"/>
            </svg>

            <span class="type-card__label">{{ type.name }}</span>

            <button
              type="button"
              class="type-card__edit"
              aria-label="Edit {{ type.name }}"
              (click)="edit(type); $event.stopPropagation()">
              <svg viewBox="0 0 12 12" class="icon-edit" aria-hidden="true">
                <path d="M8.5 1.5l2 2-6.5 6.5H2v-2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
            </button>

            <button
              type="button"
              class="type-card__remove"
              aria-label="Remove {{ type.name }}"
              (click)="askDelete(type, $event)">
              <svg viewBox="0 0 12 12" class="icon-x" aria-hidden="true">
                <path d="M1 1l10 10M11 1L1 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </ng-container>

        <ng-template #emptyState>
          <div class="dt-empty">
            <svg viewBox="0 0 40 40" class="dt-empty__icon" aria-hidden="true">
              <path d="M10 5l8-1 12 12-9 9-12-12z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
            <p>No dress types yet</p>
            <span>Add your first one above.</span>
          </div>
        </ng-template>
      </div>
    </section>
  </main>

  <!-- ============ Delete confirm dialog ============ -->
  <div class="dt-modal" *ngIf="pendingDelete">
    <div class="dt-modal__backdrop" (click)="cancelDelete()"></div>
    <div class="dt-modal__card">
      <h3 class="dt-modal__title">Delete dress type?</h3>
      <p class="dt-modal__text">
        Are you sure you want to delete <strong>{{ pendingDelete.name }}</strong>?
        This action cannot be undone.
      </p>
      <div class="dt-modal__actions">
        <button type="button" class="btn btn--ghost" (click)="cancelDelete()">Cancel</button>
        <button type="button" class="btn btn--danger" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- ============ Toast notifications ============ -->
  <div class="dt-toasts">
    <div
      class="dt-toast"
      *ngFor="let t of toasts; trackBy: trackByToast"
      [class.dt-toast--success]="t.type === 'success'"
      [class.dt-toast--error]="t.type === 'error'"
      (click)="dismiss(t)">
      <svg *ngIf="t.type === 'success'" viewBox="0 0 12 12" class="dt-toast__icon" aria-hidden="true">
        <path d="M1.5 6.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="t.type === 'error'" viewBox="0 0 12 12" class="dt-toast__icon" aria-hidden="true">
        <path d="M1 1l10 10M11 1L1 11" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round"/>
      </svg>
      <span class="dt-toast__text">{{ t.message }}</span>
    </div>
  </div>
</div>

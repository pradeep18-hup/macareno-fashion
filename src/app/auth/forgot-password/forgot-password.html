<div class="fp-page">
  <div class="fp-card">
    <h2>Forgot password</h2>
    <p class="fp-sub" *ngIf="step() === 1">Enter your registered email. We'll send an OTP.</p>
    <p class="fp-sub" *ngIf="step() === 2">Enter the 6-digit OTP sent to your email.</p>
    <p class="fp-sub" *ngIf="step() === 3">Set your new password.</p>

    <p class="fp-error" *ngIf="error()">{{ error() }}</p>
    <p class="fp-info" *ngIf="info()">{{ info() }}</p>

    <!-- STEP 1 -->
    <form *ngIf="step() === 1" [formGroup]="emailForm" (ngSubmit)="sendOtp()">
      <div class="fp-field">
        <label for="fp-email">Email</label>
        <input id="fp-email" type="email" formControlName="email" placeholder="you@example.com" />
        <span class="fp-hint" *ngIf="emailForm.get('email')?.touched && emailForm.get('email')?.invalid">
          Enter a valid email
        </span>
      </div>
      <button class="fp-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Sending…' : 'Send OTP' }}
      </button>
    </form>

    <!-- STEP 2 -->
    <form *ngIf="step() === 2" [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
      <div class="fp-field">
        <label for="fp-otp">OTP</label>
        <input id="fp-otp" type="text" inputmode="numeric" maxlength="6"
               formControlName="otp" placeholder="6-digit OTP" class="fp-otp" />
        <span class="fp-hint" *ngIf="otpForm.get('otp')?.touched && otpForm.get('otp')?.invalid">
          OTP must be 6 digits
        </span>
      </div>
      <button class="fp-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Verifying…' : 'Verify OTP' }}
      </button>
      <div class="fp-links">
        <button type="button" class="fp-link" (click)="back()">Change email</button>
        <button type="button" class="fp-link" (click)="resendOtp()" [disabled]="loading()">Resend OTP</button>
      </div>
    </form>

    <!-- STEP 3 -->
    <form *ngIf="step() === 3" [formGroup]="passForm" (ngSubmit)="resetPassword()">
      <div class="fp-field">
        <label for="fp-new">New password</label>
        <input id="fp-new" type="password" formControlName="newPassword" placeholder="Min 6 characters" />
        <span class="fp-hint" *ngIf="passForm.get('newPassword')?.touched && passForm.get('newPassword')?.invalid">
          Password must be at least 6 characters
        </span>
      </div>
      <div class="fp-field">
        <label for="fp-confirm">Confirm password</label>
        <input id="fp-confirm" type="password" formControlName="confirmPassword" placeholder="Re-enter password" />
        <span class="fp-hint" *ngIf="passForm.get('confirmPassword')?.touched && passForm.hasError('mismatch')">
          Passwords do not match
        </span>
      </div>
      <button class="fp-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Saving…' : 'Change password' }}
      </button>
    </form>

    <a class="fp-back" routerLink="/login">← Back to login</a>
  </div>
</div>

<!-- login.component.html -->
<div class="auth-page">
  <!-- LEFT: Brand + Auth form -->
  <div class="auth-page__left">
    <header class="auth-page__brand">
      <a href="/" class="auth-page__brand-link auth-page__brand-link--logo" aria-label="Macarena">
        <img src="assets/logo2.png" class="logo" alt="Logo">
        <span class="brand-wordmark-wrap">
          <svg class="brand-squiggle" viewBox="0 0 340 70" preserveAspectRatio="none" aria-hidden="true">
            <path
              class="brand-squiggle__line brand-squiggle__line--accent"
              d="M-10,45 C 20,10 45,70 75,35 C 105,0 130,60 160,32 C 190,4 215,62 245,34 C 275,6 300,58 330,30 C 345,16 355,24 365,20"
              fill="none"
            />
            <path
              class="brand-squiggle__line brand-squiggle__line--gold"
              d="M-10,25 C 15,55 40,-5 70,28 C 100,60 125,2 155,30 C 185,58 210,4 240,30 C 270,56 295,6 325,32"
              fill="none"
            />
          </svg>
          <span class="brand-wordmark">
            <span class="brand-letter" style="--i:0">M</span>
            <span class="brand-letter" style="--i:1">a</span>
            <span class="brand-letter" style="--i:2">c</span>
            <span class="brand-letter" style="--i:3">a</span>
            <span class="brand-letter" style="--i:4">r</span>
            <span class="brand-letter" style="--i:5">e</span>
            <span class="brand-letter" style="--i:6">n</span>
            <span class="brand-letter" style="--i:7">a</span>
          </span>
        </span>
      </a>
    </header>

    <div class="auth-page__content">
      <p class="auth-page__theme-line">Timeless Dresses, Made for the Modern Woman</p>

      <div class="auth-card">
        <form (ngSubmit)="onSubmit()" novalidate>
          <div class="field">
            <label for="email">Email </label>
            <input
              id="email"
              type="text"
              name="email"
              autocomplete="username"
              placeholder="Enter your email or admin name"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              required
            />
          </div>

          <div class="field">
            <div class="field__label-row">
              <label for="password">Password</label>
              <a href="/forgot-password" class="field__aux-link">Forgot?</a>
            </div>
            <div class="field__password-wrap">
              <input
                id="password"
                [type]="showPassword() ? 'text' : 'password'"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                required
              />
              <button
                type="button"
                class="field__toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              >
                <ng-container *ngIf="!showPassword(); else hideIcon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
                  </svg>
                </ng-container>
                <ng-template #hideIcon>
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C3.9 8.4 2 12 2 12s4 7 11 7c2 0 3.7-.5 5.1-1.3M17.5 17.4C20 15.7 22 12 22 12s-1.6-2.8-4.4-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                </ng-template>
              </button>
            </div>
          </div>

          <label class="checkbox-row">
            <input
              type="checkbox"
              name="rememberMe"
              [ngModel]="rememberMe()"
              (ngModelChange)="rememberMe.set($event)"
            />
            <span>Keep me signed in</span>
          </label>

          <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

          <button type="submit" class="submit-btn" [disabled]="loading()">
            {{ loading() ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>
      </div>

      <!-- ✅ Merged footer + follow us into a single block -->
      <div class="auth-footer-block">
        <p class="auth-page__footer">
          New here?
          <a routerLink="/register">Create an account</a>
        </p>

        <div class="follow-us">
          <span class="follow-us__label">Follow us</span>
          <div class="follow-us__icons">
            <a href="https://instagram.com/macarena" target="_blank" rel="noopener"
               class="follow-us__link" aria-label="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4" />
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
              </svg>
            </a>

            <a href="https://facebook.com/macarena" target="_blank" rel="noopener"
               class="follow-us__link" aria-label="Facebook">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.5 21v-7.5h2.6l.4-3.1h-3V8.4c0-.9.3-1.5 1.6-1.5h1.6V4.1c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1v2.3H7.5v3.1h2.8V21h3.2Z"/>
              </svg>
            </a>

            <a href="https://threads.net/@macarena" target="_blank" rel="noopener"
               class="follow-us__link" aria-label="Threads">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c5.5 0 9-3.5 9-9.5 0-6-4-9.5-9-9.5S3 6.5 3 12.5 6.5 22 12 22Z" />
                <path d="M14.5 10.5c-.4-1.5-1.6-2.5-3.2-2.5-2 0-3.3 1.5-3.3 3.5s1.3 3.5 3.3 3.5c1.7 0 2.9-1.2 3.1-3 .1-1.1-.1-2-.6-2.7" />
                <path d="M12 14.5c.8 1.4 2 2.2 3.5 2 1.4-.2 2.3-1.3 2.5-2.7.1-1-.4-1.7-1.4-2" />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Editorial image panel -->
  <aside class="auth-page__right">
    <img
      class="auth-page__image"
      src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1400&auto=format&fit=crop&q=80"
      alt="Macarena Autumn / Winter 26 collection"
    />
    <div class="auth-page__overlay">
      <div class="auth-page__overlay-inner">
        <span class="auth-page__overlay-tag">Autumn / Winter 26</span>
        <span class="auth-page__overlay-title">The New Edit</span>
        <span class="auth-page__overlay-sub">Tailored pieces, softly structured.</span>
      </div>
    </div>
  </aside>
</div>

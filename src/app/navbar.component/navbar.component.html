<header class="navbar" [class.is-scrolled]="isScrolled()">
  <div class="navbar__inner container">
    <!-- Logo Image -->
    <a href="" routerLink="" class="navbar__logo-wrap" (click)="closeMenu()">
      <img src="assets/logo2.png" class="logo" alt="Logo">
      <span class="navbar__logo">MACARENA</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="navbar__links" aria-label="Primary">
      @for (link of links; track link.routerLink) {
        <a [routerLink]="link.routerLink" class="navbar__link">{{ link.label }}</a>
      }
    </nav>

    <!-- Actions -->
    <div class="navbar__actions">
      <button class="icon-btn" aria-label="Search">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none">
          <circle cx="8.2" cy="8.2" r="6.2" stroke="currentColor" stroke-width="1.4" />
          <line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>

      <button class="icon-btn icon-btn--account" aria-label="Account">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none">
          <circle cx="9.5" cy="5.6" r="3.4" stroke="currentColor" stroke-width="1.4" />
          <path d="M2.5 17c1.2-3.8 4.2-5.7 7-5.7s5.8 1.9 7 5.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>

      <button class="icon-btn icon-btn--bag" aria-label="Shopping bag, 0 items">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none">
          <path d="M4.5 6.5h10l-.8 9.4a1.5 1.5 0 0 1-1.5 1.4H6.8a1.5 1.5 0 0 1-1.5-1.4L4.5 6.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
          <path d="M7 6.2V5a2.5 2.5 0 0 1 5 0v1.2" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <span class="icon-btn__badge">0</span>
      </button>

      <!-- Hamburger -->
      <button
        class="hamburger"
        [class.is-open]="isMenuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.is-open]="isMenuOpen()">
    <div class="mobile-menu__inner">
      @for (link of links; track link.routerLink) {
        <a 
          [routerLink]="link.routerLink" 
          class="mobile-menu__link" 
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <!-- Mobile-only actions -->
      <div class="mobile-menu__actions">
        <a href="#" class="mobile-menu__action">Search</a>
        <a href="#" class="mobile-menu__action">Account</a>
        <a href="#" class="mobile-menu__action">Bag (0)</a>
      </div>
    </div>
  </div>

  <!-- Scrim/Overlay -->
  @if (isMenuOpen()) {
    <div class="mobile-menu__scrim" (click)="closeMenu()" aria-label="Close menu"></div>
  }
</header>

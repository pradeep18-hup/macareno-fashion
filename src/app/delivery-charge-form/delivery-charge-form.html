<div class="charge-page">
  <h2>Delivery Charges</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Courier Name</label>
      <select formControlName="courierId">
        <option [ngValue]="null" disabled selected>Select Courier</option>
        <option *ngFor="let c of couriers" [ngValue]="c.id">
          {{ c.companyName }} ({{ c.phoneNumber }})
        </option>
      </select>
    </div>

    <div class="field">
      <label>Weight (kg)</label>
      <input type="number" step="0.1" formControlName="weightKg" placeholder="e.g. 1.5" />
    </div>

    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" formControlName="amount" placeholder="e.g. 60" />
    </div>

    <button type="submit" [disabled]="form.invalid">Add Charge</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Courier</th>
        <th>Weight (kg)</th>
        <th>Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of charges">
        <td>{{ c.courierName }}</td>
        <td>{{ c.weightKg }}</td>
        <td>₹{{ c.amount }}</td>
        <td><button class="delete-btn" (click)="remove(c.id)">Delete</button></td>
      </tr>
      <tr *ngIf="charges.length === 0">
        <td colspan="4" class="empty">No delivery charges added yet</td>
      </tr>
    </tbody>
  </table>
</div>

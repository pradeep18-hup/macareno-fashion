<div class="cr-page">
  <header class="cr-header">
    <div class="cr-header__title-group">
      <svg viewBox="0 0 24 24" class="cr-header__icon" aria-hidden="true">
        <path d="M2 7h11v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M13 10h4l4 3v3h-8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="6.5" cy="18" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="17.5" cy="18" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <div>
        <span class="eyebrow">Atelier · Fulfillment</span>
        <h1 class="cr-title">
          Courier Companies
          <span class="count-note">{{ couriers.length }} total</span>
        </h1>
        <p class="cr-subtitle">Courier partners used to ship orders</p>
      </div>
    </div>
  </header>

  <main class="cr-main">
    <form class="cr-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="companyName">Courier company name</label>
        <input
          id="companyName"
          type="text"
          formControlName="companyName"
          placeholder="e.g. DTDC, BlueDart" />
      </div>

      <div class="field">
        <label for="phoneNumber">Phone number</label>
        <input
          id="phoneNumber"
          type="text"
          formControlName="phoneNumber"
          placeholder="10 digit number" />
      </div>

      <button type="submit" class="btn btn--primary" [disabled]="form.invalid">
        <svg viewBox="0 0 12 12" class="icon-plus" aria-hidden="true">
          <path d="M6 1v10M1 6h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Add courier</span>
      </button>
    </form>

    <div class="table-scroll" *ngIf="couriers.length; else emptyState">
      <table class="cr-table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Phone number</th>
            <th class="col-action">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of couriers">
            <td class="cell-name" data-label="Company">
              <span class="avatar">{{ c.companyName.charAt(0).toUpperCase() }}</span>
              <span>{{ c.companyName }}</span>
            </td>
            <td class="cell-mono" data-label="Phone">{{ c.phoneNumber }}</td>
            <td class="col-action" data-label="Action">
              <button type="button" class="delete-btn" (click)="remove(c.id)">
                <svg viewBox="0 0 14 14" class="icon-trash" aria-hidden="true">
                  <path d="M2.5 4h9M5.5 4V2.5h3V4M3.5 4l.6 8h5.8l.6-8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
                <span>Delete</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">
        <svg viewBox="0 0 60 60" aria-hidden="true" class="empty-flourish">
          <path d="M12 26h22v14H12z" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M34 30h8l6 5v5H34z" fill="none" stroke="currentColor" stroke-width="1"/>
          <circle cx="19" cy="42" r="2.5" fill="none" stroke="currentColor" stroke-width="0.9"/>
          <circle cx="42" cy="42" r="2.5" fill="none" stroke="currentColor" stroke-width="0.9"/>
        </svg>
        <p class="empty-title">No couriers added yet</p>
        <span class="empty-note">Add your first courier partner above.</span>
      </div>
    </ng-template>
  </main>
</div>

<section class="profile-page">

  <!-- Sidebar -->
  <aside class="profile-sidebar">
    <div class="profile-sidebar__user">
      <div class="profile-sidebar__avatar">{{ initials }}</div>
      <div>
        <p class="profile-sidebar__name">{{ profile.fullName || 'Loading…' }}</p>
        <p class="profile-sidebar__email">{{ profile.email }}</p>
        <span class="profile-sidebar__role">
          {{ isAdmin ? 'Administrator' : 'Customer' }}
        </span>
      </div>
    </div>

    <nav class="profile-sidebar__nav">
      <button
        class="sidebar-link"
        [class.sidebar-link--active]="activeTab === 'profile'"
        (click)="setTab('profile')">
        Personal Info
      </button>

      <button
        class="sidebar-link"
        [class.sidebar-link--active]="activeTab === 'password'"
        (click)="setTab('password')">
        Password
      </button>
    </nav>
  </aside>

  <!-- Content -->
  <div class="profile-content">

    <div class="profile-state" *ngIf="loading()">Loading profile…</div>

    <div class="profile-state profile-state--error" *ngIf="!loading() && errorMessage()">
      ⚠️ {{ errorMessage() }}
      <button class="retry-btn" (click)="reload()">Retry</button>
    </div>

    <!-- Personal Info -->
    <div class="profile-card" *ngIf="!loading() && !errorMessage() && activeTab === 'profile'">
      <div class="profile-card__header">
        <h3>Personal Information</h3>
        <button class="edit-btn" *ngIf="!editing" (click)="editing = true">Edit</button>
      </div>

      <div class="profile-field">
        <label>{{ isAdmin ? 'Admin Name' : 'Full Name' }}</label>
        <input type="text" [(ngModel)]="profile.fullName" [disabled]="!editing" />
      </div>

      <div class="profile-field">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="profile.email" [disabled]="!editing" />
      </div>

      <div class="profile-field" *ngIf="!isAdmin">
        <label>Mobile Number</label>
        <input type="tel" [(ngModel)]="profile.phoneNumber" [disabled]="!editing" />
      </div>

      <div class="profile-field" *ngIf="profile.createdAt">
        <label>Member Since</label>
        <input type="text" [value]="profile.createdAt | date: 'dd MMM yyyy'" disabled />
      </div>

      <p class="field-success" *ngIf="successMessage()">{{ successMessage() }}</p>

      <div class="profile-card__actions" *ngIf="editing">
        <button class="btn btn--ghost" (click)="cancel()" [disabled]="saving()">Cancel</button>
        <button class="btn btn--primary" (click)="save()" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save Changes' }}
        </button>
      </div>
    </div>

    <!-- Password -->
    <div class="profile-card" *ngIf="!loading() && !errorMessage() && activeTab === 'password'">
      <div class="profile-card__header">
        <h3>Change Password</h3>
      </div>

      <div class="profile-field">
        <label>Current Password</label>
        <input type="password" [(ngModel)]="passwordForm.current" placeholder="Enter current password" />
      </div>

      <div class="profile-field">
        <label>New Password</label>
        <input type="password" [(ngModel)]="passwordForm.new" placeholder="Enter new password" />
      </div>

      <div class="profile-field">
        <label>Confirm New Password</label>
        <input type="password" [(ngModel)]="passwordForm.confirm" placeholder="Re-enter new password" />
      </div>

      <p class="field-error" *ngIf="passwordError">{{ passwordError }}</p>
      <p class="field-success" *ngIf="passwordSuccess">Password updated successfully.</p>

      <div class="profile-card__actions">
        <button class="btn btn--primary" (click)="changePassword()" [disabled]="changingPassword">
          {{ changingPassword ? 'Updating…' : 'Update Password' }}
        </button>
      </div>
    </div>

  </div>
</section>

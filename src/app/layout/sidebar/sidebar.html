<!-- ============================================================
     SIDEBAR (drawer on mobile, column on desktop)
     ============================================================ -->
<aside class="admin-sidebar"
       [class.is-collapsed]="isCollapsed"
       [class.mobile-open]="mobileOpen">

  <!-- Decorative corner flourish -->
  <svg class="corner-flourish" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M2 118 C 2 60, 60 2, 118 2"
          fill="none" stroke="currentColor" stroke-width="1" opacity="0.25"/>
    <circle cx="2" cy="118" r="2.5" fill="currentColor" opacity="0.4"/>
  </svg>

  <!-- ============ BRAND ============ -->
  <div class="sidebar-brand" routerLink="/" (click)="closeMobileMenu()">
    <div class="brand-mark" aria-hidden="true">
      <img src="assets/logo2.png" alt="Macarena logo">
    </div>

    <div class="brand-copy">
      <span class="brand-name">Macarena</span>
      <span class="brand-sub">Atelier Admin</span>
    </div>

    <!-- Collapse toggle (desktop only) -->
    <button class="collapse-toggle"
            type="button"
            (click)="toggle(); $event.stopPropagation()"
            [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg viewBox="0 0 20 20" class="toggle-icon" [class.flip]="isCollapsed">
        <path d="M12 4 L 6 10 L 12 16" fill="none"
              stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Close button (mobile only) -->
    <button class="mobile-close"
            type="button"
            (click)="closeMobileMenu(); $event.stopPropagation()"
            aria-label="Close menu">
      <svg viewBox="0 0 20 20">
        <path d="M5 5 L 15 15 M 15 5 L 5 15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ============ NAV ============ -->
  <nav class="sidebar-nav">
    <span class="nav-eyebrow">Menu</span>

    <a *ngFor="let item of navItems; let i = index"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
       class="nav-item"
       [style.--i]="i"
       (click)="closeMobileMenu()">

      <span class="nav-icon" aria-hidden="true">
        <i [class]="item.icon"></i>
      </span>
      <span class="nav-text">{{ item.label }}</span>
      <span class="nav-arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16">
          <path d="M5 4 L 10 8 L 5 12" fill="none"
                stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </a>

    <!-- Back to public site -->
    <button type="button" class="nav-item nav-item--home" (click)="goHome()">
      <span class="nav-icon" aria-hidden="true">
        <i class="bi bi-house"></i>
      </span>
      <span class="nav-text">Back to Store</span>
      <span class="nav-arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16">
          <path d="M5 4 L 10 8 L 5 12" fill="none"
                stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
  </nav>

  <!-- ============ FOOTER ============ -->
  <div class="sidebar-footer">
    <div class="footer-card">
      <div class="footer-avatar" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="19" fill="none"
                  stroke="currentColor" stroke-width="1" opacity="0.35"/>
          <text x="20" y="26" text-anchor="middle"
                font-family="Fraunces, Georgia, serif"
                font-size="16" font-weight="500" fill="currentColor">{{ adminInitial }}</text>
        </svg>
      </div>
      <div class="footer-meta">
        <span class="footer-name">{{ adminName }}</span>
        <span class="footer-status">
          <span class="dot"></span>
          {{ adminEmail || 'Signed in' }}
        </span>
      </div>
      <button class="footer-action" type="button" aria-label="Sign out" (click)="openLogoutConfirm()">
        <svg viewBox="0 0 20 20">
          <path d="M12 4 H 5 a 1 1 0 0 0 -1 1 v 10 a 1 1 0 0 0 1 1 h 7"
                fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 7 l 3 3 l -3 3 M 17 10 H 9"
                fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</aside>

<!-- ============================================================
     SCRIM (dark overlay behind drawer) — sibling AFTER sidebar
     ============================================================ -->
<div class="mobile-scrim"
     [class.show]="mobileOpen"
     (click)="closeMobileMenu()"
     aria-hidden="true"></div>

<!-- ============================================================
     MOBILE TOP BAR (hamburger) — sibling AFTER sidebar
     hides automatically when drawer is open (via CSS sibling selector)
     ============================================================ -->
<header class="mobile-topbar">
  <button type="button"
          class="hamburger"
          (click)="toggleMobileMenu()"
          aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <span class="topbar-title">Macarena Admin</span>
</header>

<!-- ============================================================
     LOGOUT CONFIRM POPUP
     ============================================================ -->
<div class="logout-backdrop" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title"
       (click)="$event.stopPropagation()">
    <div class="logout-icon" aria-hidden="true">
      <svg viewBox="0 0 20 20">
        <path d="M12 4 H 5 a 1 1 0 0 0 -1 1 v 10 a 1 1 0 0 0 1 1 h 7"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 7 l 3 3 l -3 3 M 17 10 H 9"
              fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h3 id="logout-title">Sign out?</h3>
    <p>Are you sure you want to sign out of the admin panel?</p>
    <div class="logout-actions">
      <button type="button" class="logout-btn logout-btn--ghost" (click)="cancelLogout()">Cancel</button>
      <button type="button" class="logout-btn logout-btn--primary" (click)="confirmLogout()">Yes, sign out</button>
    </div>
  </div>
</div>
